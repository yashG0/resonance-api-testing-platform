<text x="735" y="449" class="cardtitle">Rust coordinator</text>
<path d="M735 459q109 3 219 0" fill="none" stroke="#c17a13" stroke-width="3" stroke-linecap="round"/>
<path d="M735 480q1-8 11-8q83-4 228 0q8 1 9 9v30q-1 9-10 9q-119 2-228 0q-9-1-10-9z" fill="#fff8e7" stroke="#b88c42" stroke-width="2"/>
<text x="861" y="503" text-anchor="middle" class="body" font-weight="700">Tokio async runtime</text>
<text x="735" y="552" class="section">WHEN YOU PRESS SEND</text>
<circle cx="750" cy="579" r="13" fill="#fff" class="outline"/><text x="750" y="586" text-anchor="middle" class="small" font-weight="700">1</text>
<text x="776" y="586" class="body">Save the current request</text>
<text x="776" y="607" class="small">SQLite work off the UI thread</text>
<circle cx="750" cy="632" r="13" fill="#fff" class="outline"/><text x="750" y="639" text-anchor="middle" class="small" font-weight="700">2</text>
<text x="776" y="639" class="body">Load collection variables</text>
<circle cx="750" cy="679" r="13" fill="#fff" class="outline"/><text x="750" y="686" text-anchor="middle" class="small" font-weight="700">3</text>
<text x="776" y="686" class="body">Run the HTTP task async</text>
<circle cx="750" cy="726" r="13" fill="#fff" class="outline"/><text x="750" y="733" text-anchor="middle" class="small" font-weight="700">4</text>
<text x="776" y="733" class="body">Record + show the response</text>
<text x="776" y="756" class="small">Back on the Slint event loop</text>

<!-- HTTP client card -->
<path d="M1068 356q0-16 17-17q153-3 345 1q16 0 17 17q3 104 0 221q-1 16-18 17q-187 3-344 0q-17 0-17-18q-2-107 0-221Z" fill="#f8dfe6" class="outline"/>
