<text x="1127" y="396" class="section">03 · NETWORK</text>
<text x="1094" y="449" class="cardtitle">Reqwest + rustls</text>
<path d="M1094 459q111 2 221 0" fill="none" stroke="#d05d7b" stroke-width="3" stroke-linecap="round"/>
<text x="1094" y="493" class="body">Build URL, query, headers, auth, body</text>
<text x="1094" y="525" class="body">Substitute collection variables</text>
<text x="1094" y="557" class="body">Capture status + response metadata</text>
<path d="M1093 590q116 2 323 0" class="echo-line"/>
<text x="1094" y="620" class="small">10s connect · 30s request · 5 MiB cap</text>

<!-- storage card -->
<path d="M1068 651q1-16 17-17q165-3 347 0q16 1 16 18q4 122 0 207q-1 16-18 17q-170 3-344 0q-17 0-18-17q-3-122 0-208Z" fill="#dff1df" class="outline"/>
<path d="M1072 655q0-15 16-16q173 1 342 1q13 0 14 15" class="echo"/>
