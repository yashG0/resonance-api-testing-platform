<text x="1094" y="746" class="cardtitle">SQLite · rusqlite</text>
<text x="1094" y="778" class="body">Per-user requests.sqlite3</text>
<text x="1094" y="808" class="small">Collections · saved requests · variables · history</text>
<path d="M1094 836q127 2 281 0" class="echo-line"/>
<text x="1094" y="860" class="small">WAL mode · history capped at 500 entries</text>

