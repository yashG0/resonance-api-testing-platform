<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#dcd9d1"/></pattern>
  <style>
    text{font-family:"Patrick Hand","Comic Sans MS",cursive;fill:#252525}
    .title{font-size:49px;font-weight:700}.sub{font-size:23px;fill:#67655f}
    .cardtitle{font-size:31px;font-weight:700}.section{font-size:18px;font-weight:700;letter-spacing:1px;fill:#66635d}
    .body{font-size:22px}.small{font-size:18px;fill:#56534d}.tiny{font-size:16px;fill:#67645e}
    .outline{stroke:#282725;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    .echo{fill:none;stroke:#282725;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;opacity:.28}
    .line{fill:none;stroke:#353431;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    .echo-line{fill:none;stroke:#353431;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.34}
    .blue{stroke:#3584e4}
    .green{stroke:#14856f}
  </style>
</defs>

<!-- paper -->
<rect width="1800" height="1120" fill="#fbfaf6"/>
<rect width="1800" height="1120" fill="url(#dots)" opacity=".5"/>

<!-- header -->
<g transform="translate(76 66)">
  <path d="M2 19 C2 8 9 3 20 4 C32 3 41 11 40 22 C40 34 30 40 18 39 C7 40 0 31 2 19Z" fill="#dcecff" class="outline"/>
  <path d="M12 13h15l8 9-8 8-6-6 5-4-5-5H12zM11 22l8 7-7 7z" fill="none" stroke="#3584e4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="130" y="88" font-size="25" font-weight="700">Resonance</text>
<path d="M130 96q57 3 115-1" class="echo-line"/>
<text x="77" y="163" class="title">How a request moves through the app</text>
<path d="M79 177q250 4 567-2" fill="none" stroke="#3584e4" stroke-width="4" stroke-linecap="round"/>
<text x="80" y="211" class="sub">A local-first desktop API client · the request goes straight to the endpoint you choose.</text>
<path d="M1518 76q105-5 204 2q7 1 7 9v34q-1 7-10 7q-101 4-200-1q-8-1-8-9V86q0-8 7-10Z" fill="#fff2cc" class="outline"/>
<text x="1621" y="108" text-anchor="middle" font-size="21" font-weight="700">RELEASE  v0.1.1</text>

<!-- app process boundary, hand-drawn -->
