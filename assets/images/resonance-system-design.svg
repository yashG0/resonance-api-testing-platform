<text x="435" y="390" class="section">01 · PRESENTATION</text>
<text x="375" y="449" class="cardtitle">Slint UI</text>
<path d="M375 459q58 2 132 0" fill="none" stroke="#3584e4" stroke-width="3" stroke-linecap="round"/>
<text x="375" y="496" class="section">REQUEST WORKSPACE</text>
<text x="383" y="531" class="body">•  Method, URL, query params</text>
<text x="383" y="564" class="body">•  Headers, body, authentication</text>
<text x="383" y="597" class="body">•  Collections + saved requests</text>
<text x="383" y="630" class="body">•  Variables + request history</text>
<path d="M376 652q121-2 273 1" class="echo"/>
<text x="375" y="682" class="section">RESPONSE INSPECTOR</text>
<text x="383" y="715" class="body">•  Pretty / Raw body</text>
<text x="383" y="748" class="body">•  Status, headers, cookies</text>
<text x="383" y="781" class="body">•  System / light / dark theme</text>

