name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config \
            libx11-xcb-dev xinput libxcursor-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config \
            libx11-xcb-dev xinput libxcursor-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev

      - name: Add Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Build optimized executable
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package Linux archive
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="$RUNNER_TEMP/cosmic-api-${version}-linux-x86_64"
          output="release-dist/cosmic-api-${version}-linux-x86_64.tar.gz"
          mkdir -p "$staging"
          install -m 755 "target/${{ matrix.target }}/release/cosmic-api" "$staging/cosmic-api"
          cp README.md LICENSE "$staging/"
          mkdir -p release-dist
          tar -czf "$output" -C "$RUNNER_TEMP" "$(basename "$staging")"

      - name: Package Windows archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $staging = "$env:RUNNER_TEMP/cosmic-api-$version-windows-x86_64"
          $archive = "release-dist/cosmic-api-$version-windows-x86_64.zip"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          New-Item -ItemType Directory -Force -Path release-dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cosmic-api.exe" "$staging/cosmic-api.exe"
          Copy-Item README.md, LICENSE $staging
          Compress-Archive -Path "$staging/*" -DestinationPath $archive

      - name: Package macOS application bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="$RUNNER_TEMP/Cosmic API.app"
          mkdir -p release-dist
          mkdir -p "$app/Contents/MacOS"
          install -m 755 "target/${{ matrix.target }}/release/cosmic-api" "$app/Contents/MacOS/cosmic-api"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>cosmic-api</string>
            <key>CFBundleIdentifier</key><string>io.github.yashG0.resonance</string>
            <key>CFBundleName</key><string>Cosmic API</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-dist/cosmic-api-${version}-macos-${{ matrix.arch }}.zip"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.target }}
          path: release-dist/cosmic-api-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-downloads
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: cd release-downloads && sha256sum cosmic-api-* > SHA256SUMS.txt

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-downloads/cosmic-api-* release-downloads/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cosmic API $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
