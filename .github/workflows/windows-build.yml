
name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ui/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x86-64 (MSVC)
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "dist/resonance-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item "target/x86_64-pc-windows-msvc/release/resonance.exe" $package
          Copy-Item "LICENSE" $package
          Copy-Item "README.md" $package

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "dist/resonance-windows-x86_64.zip" `
            -CompressionLevel Optimal

          $hash = (Get-FileHash "dist/resonance-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  resonance-windows-x86_64.zip" |
            Out-File "dist/resonance-windows-x86_64.zip.sha256" -Encoding ascii

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resonance-windows-x86_64
          path: |
            dist/resonance-windows-x86_64.zip
            dist/resonance-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
