
[package]
name = "resonance"
version = "0.1.0"
edition = "2024"
description = "A Linux-first, offline-friendly API testing tool"
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.18"
