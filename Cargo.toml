
[package]
name = "resonance"
version = "1.2.0"
edition = "2024"
description = "A Linux-first, offline-friendly API testing tool"
license = "MIT"
build = "build.rs"

[dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }
keyring = "4.2"
slint = "1.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
directories = "6.0.0"
thiserror = "2.0.21"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3.27.0"


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
